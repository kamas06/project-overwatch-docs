<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>project-overwatch-docs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css" />
  <style>
    :root {
      --base-background-color: #0d1117;
      --sidebar-background: #161b22;
      --sidebar-nav-link-color: #58a6ff;
      --sidebar-nav-link-color--active: #f0f6fc;
      --sidebar-border-color: #30363d;
      --theme-color: #58a6ff;
      --heading-color: #f0f6fc;
      --text-color: #c9d1d9;
      --code-theme-background: #161b22;
    }
    body { background: var(--base-background-color); }
    .sidebar { background: var(--sidebar-background); border-right: 1px solid var(--sidebar-border-color); }
    .sidebar-nav a { color: var(--sidebar-nav-link-color); }
    .sidebar-nav a.active { color: var(--sidebar-nav-link-color--active); font-weight: 600; }
    .app-name-link { color: var(--heading-color) !important; }
    /* Table styling for dark theme */
    table { background: var(--base-background-color); }
    table th { background: #1c2128 !important; color: var(--heading-color) !important; border-color: var(--sidebar-border-color) !important; }
    table td { background: var(--base-background-color) !important; color: var(--text-color) !important; border-color: var(--sidebar-border-color) !important; }
    table tr:nth-child(even) { background: #0d1117 !important; }
    table tr:nth-child(odd) { background: #161b22 !important; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Project Overwatch',
      repo: '',
      basePath: '/project-overwatch-docs/',
      loadSidebar: true,
      subMaxLevel: 2,
      search: 'auto',
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
